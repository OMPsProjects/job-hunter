name: Live source check
# Hits the real job boards once a day so a site changing its format is caught early.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # live job-board data is processed here; keep the token out of .git/config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - id: live
        run: JOBHUNTER_LIVE=1 python -m pytest tests/live -q -rA
      - name: Open an issue when a source breaks
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Live source check failed (${new Date().toISOString().slice(0, 10)})`;
            const open = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "source-broken"});
            if (!open.data.length) {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title,
                labels: ["source-broken"],
                body: `A job source failed its daily live check. Run log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            }
