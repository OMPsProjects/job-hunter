name: Release
# Pushing a version tag (v1.3.0) publishes a GitHub release with job-hunter.zip (the program, in
# a folder named job-hunter), so this link always downloads the newest version:
#   https://github.com/OMPsProjects/job-hunter/releases/latest/download/job-hunter.zip
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the tag matches the version
        run: |
          v="$(python3 -c 'import re; print(re.search(r"\"(.+)\"", open("jobhunter/__init__.py").read()).group(1))')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but jobhunter/__init__.py says $v"; exit 1; }
      - name: Build the download
        run: git archive --format=zip --prefix=job-hunter/ -o job-hunter.zip HEAD
      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = index($0, "## " v " ") == 1; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "job-hunter $v" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" job-hunter.zip \
            --repo "$GITHUB_REPOSITORY" --title "job-hunter ${GITHUB_REF_NAME#v}" --notes-file notes.md
