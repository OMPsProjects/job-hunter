# pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: check-private
        name: no personal files or data
        entry: python scripts/check_private.py
        language: system
        pass_filenames: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
