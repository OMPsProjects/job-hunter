# Commercial real estate finance: lenders, debt funds, real estate private equity, capital markets,
# plus recruiters and job boards for those jobs. Career sites with an ats and slug were checked on
# 2026-10-29 and are read directly every run; the rest go on the check-by-hand list (they use
# systems job-hunter can't read, or post only on their own pages). Big banks and brokers are
# searched by your titles, so only matching roles come back.
# Not here because they post no openings anywhere public: Madison Realty Capital, Ladder Capital
# and Argentic (they use SelectLeaders and LinkedIn), and retained search firms such as Ferguson
# Partners, Odyssey, Paragon, Jackson Lucas, Heidrick, Russell Reynolds and Spencer Stuart.
