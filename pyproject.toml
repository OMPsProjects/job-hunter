[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunter"
dynamic = ["version"]
description = "Find jobs across many boards, confirm them on the employer's site, rank them against your resume, and fill applications with a human on the submit button."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Orren Prunty" }]
keywords = ["job search", "jobs", "resume", "claude", "career"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
]
dependencies = [
  "python-jobspy>=1.1.80",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "ruamel.yaml>=0.18",
  "reportlab>=4.0",
  "pypdf>=6.21.4",
  "pillow>=13.0; python_version >= '3.11'",
  "pillow>=12.3; python_version < '3.11'",
  "python-docx>=1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
ml = ["sentence-transformers>=6.0", "torch>=2.4"]   # optional JobBERT title matching (~2 GB)
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.16.9", "mypy==2.4.0", "types-PyYAML", "pre-commit>=3"]

[project.scripts]
job-hunter = "jobhunter.cli:main"

[project.urls]
Issues = "https://github.com/OMPsProjects/job-hunter/issues"

[tool.setuptools]
packages = ["jobhunter", "jobhunter.sources", "jobhunter.data", "jobhunter.web", "jobhunter.vendor",
            "jobhunter.vendor.slop_guard", "jobhunter.vendor.slop_guard.rules",
            "jobhunter.vendor.slop_guard.rules.paragraph", "jobhunter.vendor.slop_guard.rules.passage",
            "jobhunter.vendor.slop_guard.rules.sentence", "jobhunter.vendor.slop_guard.rules.word"]

[tool.setuptools.package-data]
"jobhunter.data" = ["*.json.gz", "README.md"]
"jobhunter.web" = ["static/*", "static/fonts/*"]
"jobhunter.vendor" = ["README.md"]
"jobhunter.vendor.slop_guard" = ["LICENSE", "py.typed"]
"jobhunter.vendor.slop_guard.rules" = ["assets/*.jsonl"]

[tool.setuptools.dynamic]
version = { attr = "jobhunter.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["jobhunter"]
omit = ["jobhunter/cli.py", "jobhunter/vendor/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["tests/fixtures", "jobhunter/vendor"]  # vendored third-party code: kept as upstream wrote it

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "S"]
ignore = [
  "S310",   # urllib with user-configured URLs is the point of a job scraper
  "S101",   # asserts in tests
  "S603", "S607",
  "SIM108", "SIM102", "SIM905",
  "S311",   # random jitter, not crypto
  "S110",   # deliberate try/except/pass in logging
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"evals/*" = ["S", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
files = ["jobhunter"]
exclude = ["jobhunter/vendor/"]

[[tool.mypy.overrides]]
module = "jobhunter.vendor.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
# numpy 2.3+ ships stubs with Python 3.12-only syntax, which a 3.10 target can't parse
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
